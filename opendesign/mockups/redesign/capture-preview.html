<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KcalShot · 识别前预览</title>
<link rel="stylesheet" href="../../design-systems/kcalshot/colors_and_type.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font); color: var(--ink);
    display: flex; justify-content: center; padding: 40px 0 80px;
    background: #E7E9E4; -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

  .phone {
    width: 393px; min-height: 852px; position: relative;
    display: flex; flex-direction: column; justify-content: flex-end;
    background:
      radial-gradient(1000px 500px at 50% -200px, #EAF6EE 0%, transparent 60%),
      var(--bg);
    overflow: hidden;
  }
  /* dimmed backdrop hint of the screen behind */
  .backdrop { position: absolute; inset: 0; background: rgba(20,24,26,0.34); backdrop-filter: blur(2px); }

  /* bottom sheet */
  .sheet {
    position: relative; z-index: 2;
    background: var(--card);
    border-radius: 30px 30px 0 0;
    box-shadow: 0 -12px 40px rgba(20,24,26,0.18);
    padding: 10px 20px 30px;
    display: flex; flex-direction: column; gap: 18px;
    min-height: 720px;
  }
  .grabber { width: 40px; height: 5px; border-radius: 999px; background: var(--line); margin: 4px auto 2px; }

  .sheet-head { display: flex; align-items: center; justify-content: space-between; }
  .sheet-head .close {
    border: none; background: transparent; cursor: pointer;
    font-family: var(--font); font-size: 15px; font-weight: 600; color: var(--ink-2);
  }
  .sheet-head .title { font-size: 17px; font-weight: 800; }
  .sheet-head .spacer { width: 34px; }

  /* photo preview */
  .photo {
    position: relative; width: 100%; aspect-ratio: 4/3;
    border-radius: var(--r-card); overflow: hidden;
    background:
      repeating-linear-gradient(45deg, #F0F1EE 0 14px, #F7F8F5 14px 28px);
    display: grid; place-items: center;
  }
  .photo .ph-label {
    font-family: ui-monospace, monospace; font-size: 12px; color: var(--ink-3);
    background: rgba(255,255,255,0.7); padding: 6px 12px; border-radius: 999px;
  }
  .photo .swap {
    position: absolute; right: 12px; bottom: 12px;
    display: flex; align-items: center; gap: 6px;
    background: rgba(20,24,26,0.62); backdrop-filter: blur(6px); color: #fff;
    font-size: 12px; font-weight: 600; padding: 8px 12px; border-radius: 999px; border: none; cursor: pointer;
  }
  .photo .swap svg { width: 15px; height: 15px; }

  /* model picker */
  .field {
    display: flex; align-items: center; gap: 12px;
    background: var(--card-soft); border: 1px solid var(--line);
    border-radius: var(--r-tile); padding: 14px 16px; cursor: pointer;
  }
  .field .ic {
    width: 38px; height: 38px; border-radius: 12px; flex: none;
    background: rgba(34,197,94,0.12); color: var(--green-deep);
    display: grid; place-items: center;
  }
  .field .ic svg { width: 20px; height: 20px; }
  .field .fl { flex: 1; }
  .field .fl .k { font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .field .fl .v { font-size: 15px; font-weight: 700; margin-top: 1px; }
  .field .chev { color: var(--ink-3); }
  .field .chev svg { width: 18px; height: 18px; display: block; }

  /* supplemental note */
  .note {
    background: var(--card-soft); border: 1px solid var(--line);
    border-radius: var(--r-tile); padding: 13px 16px 14px;
  }
  .note .nk {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 700; color: var(--ink-2); margin-bottom: 8px;
  }
  .note .nk svg { width: 15px; height: 15px; color: var(--green-deep); }
  .note .nk em { font-style: normal; font-weight: 600; color: var(--ink-3); }
  .note .ninput {
    font-size: 15px; color: var(--ink-3); line-height: 1.5; min-height: 42px;
    display: flex; align-items: flex-start;
  }
  .note .ninput .caret {
    display: inline-block; width: 2px; height: 18px; background: var(--green);
    margin-right: 2px; border-radius: 1px; animation: blink 1.1s step-end infinite;
    transform: translateY(1px);
  }
  @keyframes blink { 50% { opacity: 0; } }

  .spring { flex: 1; min-height: 8px; }

  /* primary action */
  .btn-recognize {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--green), var(--green-deep));
    color: #fff; font-family: var(--font); font-size: 17px; font-weight: 800;
    padding: 17px; border-radius: 20px; box-shadow: 0 8px 22px rgba(34,197,94,0.34);
    transition: transform .12s ease, filter .12s ease;
  }
  .btn-recognize:active { transform: scale(0.98); }
  .btn-recognize svg { width: 21px; height: 21px; }

  .caption { position: absolute; top: 12px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,0.9); font-size: 12px; z-index: 3; }
</style>
</head>
<body>
<div class="phone">
  <div class="caption">识别食物 · 识别前预览（照片 + 模型 + 识别）</div>
  <div class="backdrop"></div>

  <div class="sheet">
    <div class="grabber"></div>
    <div class="sheet-head">
      <button class="close">关闭</button>
      <div class="title">识别食物</div>
      <div class="spacer"></div>
    </div>

    <!-- photo -->
    <div class="photo">
      <span class="ph-label">PHOTO · 食物照片</span>
      <button class="swap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a9 9 0 0 0-15-3.5L3 7"/><path d="M3 3v4h4"/><path d="M3 16a9 9 0 0 0 15 3.5L21 17"/><path d="M21 21v-4h-4"/></svg>
        更换照片
      </button>
    </div>

    <!-- model picker -->
    <div class="field">
      <div class="ic">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l1.7 4.4 4.4 1.7-4.4 1.7L12 14.7l-1.7-4.4L5.9 8.6l4.4-1.7z"/><path d="M18.5 14l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z"/></svg>
      </div>
      <div class="fl">
        <div class="k">识别模型</div>
        <div class="v">GPT-4o mini · 视觉</div>
      </div>
      <div class="chev">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>
      </div>
    </div>

    <!-- supplemental note -->
    <div class="note">
      <div class="nk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-11.9 7.6L3 21l1.9-6A8.5 8.5 0 1 1 21 11.5z"/></svg>
        补充说明 <em>可选</em>
      </div>
      <div class="ninput"><span class="caret"></span>例如：米饭约二两、煎蛋用少油、饮料无糖</div>
    </div>

    <div class="spring"></div>

    <!-- recognize -->
    <button class="btn-recognize">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l1.7 4.4 4.4 1.7-4.4 1.7L12 14.7l-1.7-4.4L5.9 8.6l4.4-1.7z"/><path d="M18.5 14l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z"/></svg>
      识别这一餐
    </button>
  </div>
</div>
</body>
</html>
